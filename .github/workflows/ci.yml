name: SkillPrint CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skillprint-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Upload Sites browser build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sites-browser-build
          path: |
            dist/client/
            .openai/hosting.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
